[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfred"
version = "0.1.0"
description = "Alfred, a personal assistant plugin for Claude Code: Google Calendar and Tasks, weather and a local user profile"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
  "aiohttp>=3.14.3",
  "feedparser>=6.0.14",
  "fastmcp>=2.0,<3",
  "google-auth>=2.44.0,<3",
  "google-auth-oauthlib>=1.2.2,<2",
  "neonize",
  "pydantic>=2.3,<3",
  "pydantic-settings>=2.0,<3",
  "requests>=2.31.0,<3",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "coverage>=7.11.0",
  "detect-secrets>=1.5.0",
  "mypy>=1.18.2",
  "types-requests>=2.31.0",
  "poethepoet>=0.37.0",
  "pre-commit>=3.8.0",
  "pytest>=8.4.2",
  "radon>=6.0.1",
  "ruff>=0.8.0",
  "types-pyyaml>=6.0,<6.0.12.20261001",
]

[tool.ruff]
exclude = [".venv", "__pycache__", "build", "dist", "*.egg-info"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = []
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
lines-between-types = 0
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
[[tool.mypy.overrides]]
module = ["neonize.*", "feedparser.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
